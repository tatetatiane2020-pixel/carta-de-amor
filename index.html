<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8b8ce">
  <title>Para o amor da minha vida 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="sparkle sparkle-one" aria-hidden="true">✦</div>
    <div class="sparkle sparkle-two" aria-hidden="true">♡</div>
    <p class="eyebrow">uma cartinha feita com carinho</p>
    <h1>Para o amor da minha vida</h1>
    <p class="hint" id="hint">Toque no coração para abrir sua carta</p>

    <section class="letter-area" aria-label="Carta de amor">
      <article class="letter" id="letter" aria-hidden="true">
        <div class="letter-paper">
          <span class="letter-heart" aria-hidden="true">♥</span>
          <p class="letter-title">Meu amor,</p>
          <p class="letter-message">Amo você, meu amor!!</p>
          <p class="letter-note">Você deixa meus dias mais bonitos.<br>Que sorte a minha ter você na vida.</p>
          <p class="signature">Com todo o meu amor ♡</p>
        </div>
      </article>

      <button class="envelope" id="openLetter" type="button" aria-label="Abrir a carta">
        <span class="envelope-back"></span>
        <span class="envelope-letter-peek"></span>
        <span class="envelope-left"></span>
        <span class="envelope-right"></span>
        <span class="envelope-bottom"></span>
        <span class="envelope-flap"></span>
        <span class="seal" aria-hidden="true">♥</span>
      </button>
    </section>

    <button class="replay" id="replay" type="button" hidden>Fechar cartinha ↺</button>
    <p class="footer">Feito especialmente para você <span aria-hidden="true">♥</span></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
